name: Vega

# Vega OS (Fire TV) app: lint and tests, then a Release .vpkg for armv7 (and aarch64 if asked for).
# The packages are uploaded as a workflow artifact. Tagged releases build them in release.yml.
# Runs on pull requests that touch the Vega app or the engine, or by hand (workflow_dispatch).
on:
  pull_request:
    paths:
      - 'vega/**'
      - 'ESPHamClock/**'
      - '.github/workflows/vega.yml'
  workflow_dispatch:
    inputs:
      build_aarch64:
        description: 'Also build aarch64 (no arm64 Vega device is known)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Pinned Vega SDK (the version the app is developed and tested with).
  VEGA_SDK_VERSION: '2.0.13986'

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vega
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            vega/package-lock.json
            vega/hcengine/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          (cd hcengine && npm ci && npm run build:js)

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Jest
        run: npm test

      - name: Engine host tests (C++)
        run: npm run test:engine

  build:
    name: Build .vpkg
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # build number = git commit count

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            vega/package-lock.json
            vega/hcengine/package-lock.json

      - name: Install Vega SDK
        env:
          NONINTERACTIVE: 'true'
        run: |
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh | bash
          # Opt out of the SDK's default telemetry on CI runners.
          sed -i 's/"optIn": *true/"optIn": false/' ~/vega/telemetry/config.json

      - name: Build
        working-directory: vega
        env:
          # inputs is empty on pull_request, so PRs build armv7 only.
          ARCHS: armv7${{ inputs.build_aarch64 && ' aarch64' || '' }}
        run: |
          source ~/vega/env
          npm ci
          (cd hcengine && npm ci)
          scripts/build.sh Release $ARCHS

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: hamclock-vega-vpkg
          path: vega/build/*-release/hamclock_*.vpkg
          if-no-files-found: error
