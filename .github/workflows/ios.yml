name: Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS Target
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Build HamClock iOS Scheme
        working-directory: ios
        run: |
          xcodebuild -project HamClock.xcodeproj \
                     -scheme HamClock \
                     -destination 'generic/platform=iOS Simulator' \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Validate App Bundle
        run: |
          APP_PATH="ios/build/Build/Products/Release-iphonesimulator/HamClock.app"
          echo "Checking app bundle at: $APP_PATH"
          test -d "$APP_PATH" || { echo "App bundle not found!"; exit 1; }
          plutil -lint "$APP_PATH/Info.plist"
          file "$APP_PATH/HamClock"

      - name: Run Simulator Smoke Test
        run: |
          APP_PATH="$(pwd)/ios/build/Build/Products/Release-iphonesimulator/HamClock.app"

          # Find first available iPhone/iPad simulator
          UDID=$(xcrun simctl list devices available | grep -E "iPhone|iPad" | head -1 | grep -o -E '[0-9A-F-]{36}')
          if [ -z "$UDID" ]; then
            echo "No simulator found!"
            exit 1
          fi
          echo "Booting simulator: $UDID"
          xcrun simctl boot "$UDID"

          echo "Installing $APP_PATH..."
          xcrun simctl install "$UDID" "$APP_PATH"

          echo "Granting location and privacy permissions..."
          xcrun simctl privacy "$UDID" grant all org.openhamclock.hamclock || xcrun simctl privacy "$UDID" grant location org.openhamclock.hamclock || true
          xcrun simctl location "$UDID" set 37.7749,-122.4194 || true

          echo "Launching HamClock..."
          xcrun simctl launch "$UDID" org.openhamclock.hamclock

          echo "Waiting for HamClock engine and web interface readiness..."
          for i in $(seq 1 45); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/liveweb-rw.html 2>/dev/null | grep -q "200"; then
              echo "HamClock web server is ready (attempt $i)!"
              break
            fi
            sleep 1
          done

          # Allow WKWebView in the simulator UI time to load and render the canvas
          sleep 8

          echo "Taking screenshot..."
          xcrun simctl io "$UDID" screenshot ios-simulator-screenshot.png

          echo "Shutting down simulator..."
          xcrun simctl terminate "$UDID" org.openhamclock.hamclock || true
          xcrun simctl shutdown "$UDID" || true

      - name: Upload Simulator Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshot
          path: ios-simulator-screenshot.png
          if-no-files-found: ignore
