schema-version = 1

[package]
title = "HamClock"
# Placeholder: builds pass the real version and build number (--build-version/--build-number)
# from scripts/version.js (release tag, or ESPHamClock/version.cpp; git commit count).
version = "0.1.0"
id = "org.openhamclock.hamclock"
icon = "@image/icon.png"

[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

# Turbo Modules (the embedded HamClock engine, libHcEngine.so).
[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

# WebView that shows the engine's live.html.
[[needs.module]]
id = "/com.amazon.kepler.webview_4@IWebview_4"

[wants]
# Required for useTVEventHandler (D-Pad / remote key events).
[[wants.service]]
id = "com.amazon.inputd.service"

# Web renderer service used by the WebView.
[[wants.service]]
id = "com.amazon.webview.renderer_service"

# On-screen keyboard for the settings panel's text fields (mDNS name, backend host).
[[wants.service]]
id = "com.amazon.inputmethod.service"

# Audio for the WebView's inaudible keep-awake tone: Vega holds off the screensaver only while
# media plays. Without these the WebView's requests are refused ("missing wants declaration").
[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[components]
[[components.interactive]]
id = "org.openhamclock.hamclock.main"
title = "HamClock"
icon = "@image/icon.png"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

# Allow plain HTTP to the in-app HamClock engine only.
[network-traffic-policy.cleartext]
allowed-domains = ["127.0.0.1", "localhost"]
